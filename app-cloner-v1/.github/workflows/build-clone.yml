name: Build App Clone

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: Clone app name
        required: false
        default: AppClone
        type: string
      application_id:
        description: Android applicationId
        required: false
        default: com.lomivox.appcloner
        type: string
      version_name:
        description: Version name
        required: false
        default: 1.0.0
        type: string
      version_code:
        description: Version code
        required: false
        default: "1"
        type: string
      output:
        description: Output format
        required: false
        default: apk
        type: choice
        options: [apk, aab]
      build_type:
        description: Build type
        required: false
        default: debug
        type: choice
        options: [debug, release]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="${{ inputs.application_id || 'com.lomivox.appcloner' }}"
          VERSION_CODE="${{ inputs.version_code || '1' }}"
          if [[ ! "$APP_ID" =~ ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)+$ ]]; then
            echo "Invalid applicationId"; exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid versionCode"; exit 1
          fi

      - name: Prepare clone
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name || 'AppClone' }}
          APPLICATION_ID: ${{ inputs.application_id || 'com.lomivox.appcloner' }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ inputs.version_code || '1' }}
        run: |
          set -euo pipefail
          rm -rf clone-workspace
          mkdir -p clone-workspace/app
          cp -R app/. clone-workspace/app/
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path("clone-workspace")
          replacements = {
              "__APP_NAME__": os.environ["APP_NAME"],
              "__APPLICATION_ID__": os.environ["APPLICATION_ID"],
              "__VERSION_NAME__": os.environ["VERSION_NAME"],
              "__VERSION_CODE__": os.environ["VERSION_CODE"],
          }
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix not in {".kt",".kts",".xml",".gradle",".properties",".json"}:
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for a,b in replacements.items():
                  s = s.replace(a,b)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Prepare Gradle project
        run: |
          cp settings.gradle.kts clone-workspace/
          cp build.gradle.kts clone-workspace/
          cp gradle.properties clone-workspace/
          if [ -f gradlew ]; then cp gradlew clone-workspace/; chmod +x clone-workspace/gradlew; fi
          if [ -d gradle ]; then cp -R gradle clone-workspace/; fi

      - name: Build debug APK
        if: (inputs.build_type || 'debug') == 'debug'
        working-directory: clone-workspace
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: (inputs.build_type || 'debug') == 'release' && (inputs.output || 'apk') == 'apk'
        working-directory: clone-workspace
        run: ./gradlew assembleRelease

      - name: Build release AAB
        if: (inputs.build_type || 'debug') == 'release' && (inputs.output || 'apk') == 'aab'
        working-directory: clone-workspace
        run: ./gradlew bundleRelease

      - name: Upload APK
        if: (inputs.output || 'apk') == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name || 'AppClone' }}-apk
          path: clone-workspace/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: (inputs.output || 'apk') == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name || 'AppClone' }}-aab
          path: clone-workspace/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
